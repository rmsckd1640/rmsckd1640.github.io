<div class="list" data-per="10">{% for p in include.posts %}{% include row.html p=p %}{% endfor %}</div><nav class="pager" aria-label="페이지 이동"></nav>
<script>(function(){const l=document.currentScript.previousElementSibling.previousElementSibling,pg=document.currentScript.previousElementSibling,rows=[...l.children],per=10;let cur=1,q='';
const cat=new URLSearchParams(location.search).get('t');function vis(){return rows.filter(r=>(!cat||r.dataset.tags.includes('|'+cat+'|'))&&(!q||r.textContent.toLowerCase().includes(q)))}if(cat){const h=document.querySelector('.lh h2');if(h)h.innerHTML='#'+cat.replace(/</g,'&lt;')+' <span>'+rows.filter(r=>r.dataset.tags.includes('|'+cat+'|')).length+'편</span>';document.querySelectorAll('.side [data-t]').forEach(x=>{if(x.dataset.t===cat)x.setAttribute('aria-current','page')});const all=document.querySelector('.side [data-k=all]');if(all)all.removeAttribute('aria-current')}
function draw(){const v=vis(),n=Math.max(1,Math.ceil(v.length/per));cur=Math.min(cur,n);rows.forEach(r=>r.hidden=true);v.slice((cur-1)*per,cur*per).forEach(r=>r.hidden=false);
pg.innerHTML='';if(n>1){const G=10,g0=Math.floor((cur-1)/G)*G+1,g1=Math.min(n,g0+G-1);const mk=(t,p,cls,lab)=>{const a=document.createElement('a');a.href='#';a.textContent=t;if(cls)a.className=cls;if(lab)a.setAttribute('aria-label',lab);if(p===cur&&!cls)a.setAttribute('aria-current','page');a.onclick=e=>{e.preventDefault();cur=p;draw();window.scrollTo(0,l.offsetTop-100)};pg.append(a)};if(g0>1)mk('‹',g0-1,'nx','이전 페이지 묶음');for(let i=g0;i<=g1;i++)mk(String(i),i);if(g1<n)mk('›',g1+1,'nx','다음 페이지 묶음')}
rows.forEach(r=>r.classList.remove('last'));const shown=rows.filter(r=>!r.hidden);if(shown.length)shown[shown.length-1].classList.add('last')}
const s=document.querySelector('#sbox input');const u=new URLSearchParams(location.search).get('q');if(s&&u){s.value=u;q=u.toLowerCase()}if(s)s.oninput=()=>{q=s.value.trim().toLowerCase();cur=1;draw()};draw()})()</script>
