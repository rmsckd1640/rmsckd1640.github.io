<!doctype html><html lang="ko"><head>{% include head.html %}</head><body>

<main class="in main">{% include side.html cur='all' %}<div class="col"><div class="lh"><h2>전체 글 <span>{{ site.posts | size }}편</span></h2><div id="sbox"><label><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="검색" aria-label="글 검색"></label></div></div>{% include list.html posts=site.posts %}</div>
